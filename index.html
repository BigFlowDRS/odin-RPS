<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="styles.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odin-RPS</title>
</head>
<body>
    <div class="game">
        <div class="header">Rock Paper Scissors</div>
        <div class="playZone">
            <button id="rock">Rock</button>
            <button id="paper">Paper</button>
            <button id="scissors">Scissors</button>
        </div>
        <div class="scoreZone">
            <div class="PlayerScore">Player - 0</div>
            <div class="ComputerScore">Computer - 0</div>
        </div>
        <div class="resultZone">
            <p class="p1">-</p>
            <p class="p2">-</p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
